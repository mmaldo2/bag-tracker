name: bag tracker

on:
  schedule:
    - cron: "*/20 * * * *"        # eBay + Poshmark (free) — GitHub may delay these a few minutes
    - cron: "5 2,10,18 * * *"     # adds the paid Apify pass for Depop/Mercari, ONLY if APIFY_TOKEN is set
  workflow_dispatch:
    inputs:
      sources:
        description: "cloud | ebay | poshmark | apify"
        default: "cloud"
      init:
        description: "Seed state without alerting (true/false)"
        default: "false"

concurrency:
  group: tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide sources
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sources=${{ github.event.inputs.sources }}" >> $GITHUB_OUTPUT
            echo "init=${{ github.event.inputs.init }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "5 2,10,18 * * *" ] && [ -n "${{ secrets.APIFY_TOKEN }}" ]; then
            echo "sources=apify" >> $GITHUB_OUTPUT
            echo "init=false" >> $GITHUB_OUTPUT
          else
            echo "sources=cloud" >> $GITHUB_OUTPUT
            echo "init=false" >> $GITHUB_OUTPUT
          fi

      - name: Track
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          VERDICT_URL: ${{ secrets.VERDICT_URL }}
          VERDICT_TOKEN: ${{ secrets.VERDICT_TOKEN }}
        run: |
          git config merge.jsonstate.driver "python merge_state.py %O %A %B"
          git pull --rebase --autostash
          python sync_verdicts.py
          INIT=""
          if [ "${{ steps.pick.outputs.init }}" = "true" ]; then INIT="--init"; fi
          if [ "${{ steps.pick.outputs.sources }}" = "apify" ]; then
            python tracker.py --sources cloud $INIT && python tracker.py --sources apify $INIT
          else
            python tracker.py --sources "${{ steps.pick.outputs.sources }}" $INIT
          fi

      - name: Save state
        run: |
          git config user.name "bag-tracker"
          git config user.email "bag-tracker@users.noreply.github.com"
          git config merge.jsonstate.driver "python merge_state.py %O %A %B"
          for f in state/seen.json state/verdicts.json docs/finds.json docs/verdicts.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
